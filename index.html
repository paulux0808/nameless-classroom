<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NAMELESS</title>
<style>
:root{--ink:#0a0c0c;--panel:#111514;--line:rgba(207,176,112,.25);--gold:#c5a25f;--paper:#e4d7b8;--dim:#8d8b82}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070909;color:#e9e2d2;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}body{min-height:100svh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(circle at 50% 34%,rgba(67,68,55,.17),transparent 34%),linear-gradient(135deg,#070909,#0b0e0d 56%,#060707)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px}
main{width:min(1120px,92vw);padding:clamp(34px,6vw,74px) 0;position:relative}.masthead{display:flex;align-items:end;justify-content:space-between;gap:28px;padding-bottom:22px;border-bottom:1px solid var(--line)}.brand{font:500 clamp(48px,9vw,108px)/.8 Georgia,"Times New Roman",serif;letter-spacing:.13em;color:#e4d6b5}.folio{text-align:right;font:700 10px/1.7 ui-monospace,monospace;letter-spacing:.24em;color:#8f815f}.stages{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.5vw,30px);margin-top:clamp(24px,4vw,48px)}
.stage{min-height:360px;border:1px solid var(--line);background:linear-gradient(155deg,rgba(25,29,27,.94),rgba(11,14,13,.98));color:inherit;text-align:left;padding:clamp(24px,4vw,46px);position:relative;overflow:hidden;cursor:pointer;transition:transform .25s ease,border-color .25s ease,background .25s ease}.stage:hover,.stage:focus-visible{outline:none;transform:translateY(-4px);border-color:rgba(213,178,103,.72);background:linear-gradient(155deg,rgba(32,35,31,.98),rgba(12,15,14,.98))}.stage::after{content:attr(data-number);position:absolute;right:-10px;bottom:-48px;font:500 190px/1 Georgia,serif;color:rgba(210,178,108,.055);pointer-events:none}.stage-index{font:700 10px/1 ui-monospace,monospace;letter-spacing:.26em;color:var(--gold)}.stage h2{font:500 clamp(30px,4vw,52px)/1.08 Georgia,serif;margin:66px 0 12px;letter-spacing:.04em}.stage p{max-width:390px;margin:0;color:#aaa596;font-size:14px;line-height:1.75}.stage-foot{position:absolute;left:clamp(24px,4vw,46px);right:clamp(24px,4vw,46px);bottom:28px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.08);padding-top:16px;font:700 11px/1 ui-monospace,monospace;letter-spacing:.12em}.ready{color:#85a18c}.locked{color:#b7955b}.arrow{font-size:20px;color:var(--gold)}
#gate{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:rgba(3,4,4,.82);backdrop-filter:blur(9px)}#gate.open{display:grid}.gate-card{width:min(460px,92vw);border:1px solid rgba(204,169,99,.48);background:#101312;padding:clamp(26px,5vw,48px);box-shadow:0 30px 100px #000}.gate-kicker{font:700 10px/1 ui-monospace,monospace;letter-spacing:.24em;color:var(--gold)}.gate-card h2{font:500 34px/1.15 Georgia,serif;margin:15px 0 10px}.gate-card p{color:#aaa596;font-size:14px;line-height:1.7}.code{display:block;width:100%;margin:24px 0 10px;border:1px solid #5d5545;background:#080a09;color:var(--paper);padding:15px;text-align:center;font:700 28px/1 ui-monospace,monospace;letter-spacing:.35em}.code:focus{outline:1px solid var(--gold);border-color:var(--gold)}.gate-message{height:20px;margin:0 0 12px;color:#b85f53;font-size:13px}.gate-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gate-actions button{border:1px solid #665a43;background:transparent;color:#d9ceb5;padding:12px;font-weight:700;cursor:pointer}.gate-actions .enter{background:#b28f4f;color:#111;border-color:#cba65e}
@media(max-width:720px){.masthead{align-items:start;flex-direction:column}.folio{text-align:left}.stages{grid-template-columns:1fr}.stage{min-height:300px}.stage h2{margin-top:48px}}
@media(prefers-reduced-motion:reduce){.stage{transition:none}}
</style>
</head>
<body>
<main>
  <header class="masthead"><div class="brand">NAMELESS</div><div class="folio">STAGE ARCHIVE<br>SELECT ENTRY</div></header>
  <section class="stages" aria-label="스테이지 선택">
    <button class="stage" type="button" data-number="1" data-stage-one><span class="stage-index">STAGE 01 · MEMORY FRAGMENTS</span><h2>이름 없는 교실</h2><p>교실에 남겨진 기록을 따라 한 인물의 이름을 복원합니다.</p><span class="stage-foot"><span class="ready">PLAYABLE</span><span class="arrow">→</span></span></button>
    <button class="stage" type="button" data-number="2" data-stage-two><span class="stage-index">STAGE 02 · 1943</span><h2>이름 없는 시설</h2><p>책임자의 자리에서 제출된 기록을 검토하고 시설의 다음 단계를 결정합니다.</p><span class="stage-foot"><span class="locked">STAGE 01 CODE REQUIRED</span><span class="arrow">→</span></span></button>
  </section>
</main>
<section id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <form class="gate-card" data-code-form><div class="gate-kicker">STAGE 02 ACCESS</div><h2 id="gate-title">인계 코드</h2><p>스테이지 1의 마지막 문에서 확인한 네 자리 코드를 입력하십시오.</p><input class="code" data-code-input inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" aria-label="네 자리 인계 코드"><div class="gate-message" data-code-message aria-live="polite"></div><div class="gate-actions"><button type="button" data-close>취소</button><button class="enter" type="submit">스테이지 2 시작</button></div></form>
</section>
<script>
const gate=document.querySelector('#gate'),input=document.querySelector('[data-code-input]'),message=document.querySelector('[data-code-message]');
document.querySelector('[data-stage-one]').addEventListener('click',()=>{location.href='stage1/';});
document.querySelector('[data-stage-two]').addEventListener('click',()=>{gate.classList.add('open');message.textContent='';input.value='';setTimeout(()=>input.focus(),30);});
document.querySelector('[data-close]').addEventListener('click',()=>{gate.classList.remove('open');});
gate.addEventListener('click',event=>{if(event.target===gate)gate.classList.remove('open');});
document.addEventListener('keydown',event=>{if(event.key==='Escape')gate.classList.remove('open');});
document.querySelector('[data-code-form]').addEventListener('submit',event=>{event.preventDefault();if(input.value.trim()!=='0808'){message.textContent='코드가 일치하지 않습니다.';input.select();return;}sessionStorage.setItem('nameless-stage2-access','0808');location.href='stage2/';});
</script>
</body>
</html>
