<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CH02 object preview</title><link rel="stylesheet" href="../chapter.css?v=ch02-room-4"><style>
body{overflow:auto;background:#15271e}#controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:5px;color:#ddd;font:12px system-ui}#controls button{padding:5px}#frame-host{height:calc(100dvh - 42px);width:100%;margin:auto}#frame-host.landscape{width:min(844px,100%);height:390px}#frame-host.narrow{width:min(568px,100%);height:320px}iframe{border:0;width:100%;height:100%;display:block}#surface{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:6px;box-sizing:border-box}#object{width:min(940px,100%);border:1px solid #738076;border-radius:4px;overflow:hidden}
</style></head><body><div id="controls">실제 물건 UI 점검 <button data-size="">전체 폭</button><button data-size="landscape">844 × 390</button><button data-size="narrow">568 × 320</button><button data-view="room">방</button><button data-view="desk">작업대</button><button data-view="cabinet">규정함</button><button data-view="plate">명판</button><button data-view="bench">시험대</button></div><div id="frame-host"></div>
<script src="../logic.js?v=ch02-room-4"></script><script src="../conditions.js?v=ch02-room-4"></script><script src="../chapters/ch02.js?v=ch02-room-4"></script><script>
(function(){var args=new URLSearchParams(location.search),host=document.getElementById('frame-host'),ch=N2_CHAPTERS.ch02;
if(!args.has('surface')){var frame=document.createElement('iframe');frame.title='CH02 물건';frame.src='conditions-preview.html?surface=1';host.append(frame);document.querySelectorAll('[data-size]').forEach(function(b){b.onclick=function(){host.className=b.dataset.size;};});document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){frame.src=b.dataset.view==='room'?'room-preview.html':'conditions-preview.html?surface=1&view='+b.dataset.view;};});return;}
document.getElementById('controls').remove();host.id='surface';document.body.classList.add('ch02');
var modal=document.createElement('div');modal.id='sheet';modal.className='bare escape-sheet';
var card=document.createElement('div');card.className='sheet-card';var object=document.createElement('div');object.className='sheet-body';card.append(object);modal.append(card);host.append(modal);
var s=N2.freshState();s.conditions=N2Conditions.fresh();s.greeted=true;var view=args.get('view')||'desk';
// Scene fixtures only. The real game requires collecting these objects in the room.
if(view==='desk'){N2Conditions.act(ch,s,{type:'bundle'});}
if(view==='bench'){s.phase='revised';Object.assign(s.conditions,{cards:['a','b','c','d'],routes:{a:'bench',b:'bench',c:'archive',d:'bench'},rule:true,crank:true,installed:true});}
var reader=N2Conditions.create({host:object,chapter:ch,onClose:function(){location.href='../ch02.html';},onChange:function(){if(s.phase==='revised'&&N2Conditions.complete(ch,s.conditions))s.phase='verified';},onSubmit:function(){var r=N2Conditions.judge(ch,s.conditions);if(r.ok)s.phase='contradiction';reader.render(s,view);},onStamp:function(){s.phase=s.phase==='contradiction'?'revised':'approved';reader.render(s,view);}});reader.render(s,view);
})();</script></body></html>
