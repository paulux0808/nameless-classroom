<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CH02 UI review</title><link rel="stylesheet" href="../chapter.css">
<style>body{overflow:auto;background:#26382e}#preview-controls{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#fff;font:13px system-ui}#preview-controls button{padding:8px}#preview{height:calc(100dvh - 65px);width:100%;margin:auto}#preview.landscape{width:min(844px,100%);height:390px}#preview.narrow{width:min(568px,100%);height:320px}</style></head>
<body><div id="preview-controls">CH02 문서 UI 점검 <button data-size="">전체 폭</button><button data-size="landscape">844 × 390</button><button data-size="narrow">568 × 320</button><span id="result" role="status"></span></div><div id="preview"></div>
<script src="../logic.js"></script><script src="../conditions.js"></script><script src="../chapters/ch02.js"></script><script>
(function(){
var ch=N2_CHAPTERS.ch02,s=N2.freshState();s.greeted=true;s.conditions=N2Conditions.fresh();
var host=document.getElementById('preview'),status=document.getElementById('result');
var reader=N2Conditions.create({host:host,chapter:ch,onClose:function(){location.href='../ch02.html';},onChange:function(){if(s.phase==='revised'&&N2Conditions.complete(ch,s.conditions))s.phase='verified';},onSubmit:function(){var r=N2Conditions.judge(ch,s.conditions.assignments);status.textContent=r.ok?'Enrico: 조건이 바뀌었는데 기준은 그대로였군요.':r.message;if(r.ok)s.phase='contradiction';reader.render(s);},onStamp:function(){s.phase=s.phase==='contradiction'?'revised':'approved';reader.render(s);status.textContent=s.phase==='approved'?'APPROVED · 19%':'REJECTED · 8%';}});
reader.render(s);document.querySelectorAll('[data-size]').forEach(function(b){b.onclick=function(){host.className=b.dataset.size;};});
})();
</script></body></html>
