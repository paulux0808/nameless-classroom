name: Apply frame spoiler cleanup

on:
  push:
    paths:
      - .github/workflows/fix-frame-labels.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide frame symbol names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old1='if(!sym){toast("이 액자는 네 변이 모두 같은 두께입니다.");return;}'
          new1='if(!sym){toast("액자를 살펴보았다.");return;}'
          old2='toast(SYM_KO[sym]+" 액자 — "+(S.rot[sym]*90)+"°");'
          new2='toast("액자 — "+(S.rot[sym]*90)+"°");'
          assert s.count(old1)==1, s.count(old1)
          assert s.count(old2)==1, s.count(old2)
          s=s.replace(old1,new1).replace(old2,new2)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hide frame symbol spoilers"
          git push
