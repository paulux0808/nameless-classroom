name: Extract embedded videos

on:
  push:
    paths:
      - '.github/workflows/extract-videos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract videos from index
        run: python3 .github/scripts/extract_videos.py

      - name: Verify output
        run: |
          test -s assets/video-mystery.mp4
          test -s assets/video-finale.mp4
          grep -q 'assets/video-mystery.mp4' index.html
          grep -q 'assets/video-finale.mp4' index.html
          if grep -q 'data:video/mp4;base64,' index.html; then
            echo 'Embedded video data still remains'
            exit 1
          fi
          ls -lh index.html assets/video-mystery.mp4 assets/video-finale.mp4

      - name: Commit extracted videos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/video-mystery.mp4 assets/video-finale.mp4
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Extract embedded videos from index'
          git push origin HEAD:main
