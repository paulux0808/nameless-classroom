name: Fix wall slide and umbrella

on:
  push:
    paths:
      - .github/workflows/fix-wall-slide-umbrella.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply movement and umbrella fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_move = '''function canStand(x,z){
            if(x<-4.35||x>4.35||z<-2.35||z>3.45)return false;
            for(var i=0;i<BLOCKS.length;i++){var b=BLOCKS[i];
              if(Math.abs(x-b.x)<b.hx+0.18 && Math.abs(z-b.z)<b.hz+0.18)return false;}
            return true;
          }
          function isTyping(){var a=document.activeElement;
            return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");}
          function moveStep(dt){
            if(!camera||isTyping()||exitSequence)return;
            var f=(keys.w?1:0)-(keys.s?1:0)+joy.z, r=(keys.d?1:0)-(keys.a?1:0)+joy.x;
            if(Math.abs(f)<0.02&&Math.abs(r)<0.02)return;
            var L=Math.sqrt(f*f+r*r); if(L>1){f/=L;r/=L;}
            var fx=Math.sin(yaw), fz=Math.cos(yaw);
            var rx=Math.sin(yaw-Math.PI/2), rz=Math.cos(yaw-Math.PI/2);
            var d=SPEED*dt;
            var nx=camera.position.x+(fx*f+rx*r)*d, nz=camera.position.z+(fz*f+rz*r)*d;
            if(canStand(nx,camera.position.z))camera.position.x=nx;
            if(canStand(camera.position.x,nz))camera.position.z=nz;
            camera.position.y=crouch?EYE_LOW:EYE;
          }'''

          new_move = '''function canStand(x,z){
            if(x<-4.35||x>4.35||z<-2.35||z>3.45)return false;
            for(var i=0;i<BLOCKS.length;i++){var b=BLOCKS[i];
              if(Math.abs(x-b.x)<b.hx+0.18 && Math.abs(z-b.z)<b.hz+0.18)return false;}
            return true;
          }
          /* 충돌 지점에서 가장 가까운 면의 바깥쪽 법선 */
          function collisionNormal(x,z){
            if(x<-4.35)return{x:1,z:0};
            if(x> 4.35)return{x:-1,z:0};
            if(z<-2.35)return{x:0,z:1};
            if(z> 3.45)return{x:0,z:-1};
            for(var i=0;i<BLOCKS.length;i++){
              var b=BLOCKS[i], ex=b.hx+0.18, ez=b.hz+0.18;
              if(Math.abs(x-b.x)>=ex||Math.abs(z-b.z)>=ez)continue;
              var dl=x-(b.x-ex), dr=(b.x+ex)-x;
              var db=z-(b.z-ez), dt=(b.z+ez)-z;
              var m=Math.min(dl,dr,db,dt);
              if(m===dl)return{x:-1,z:0};
              if(m===dr)return{x:1,z:0};
              if(m===db)return{x:0,z:-1};
              return{x:0,z:1};
            }
            return null;
          }
          /* 벽에 닿으면 안쪽 성분만 버리고 접선 방향으로 계속 미끄러진다. */
          function slideMove(dx,dz){
            var dist=Math.hypot(dx,dz), steps=Math.max(1,Math.ceil(dist/0.055));
            var sx=dx/steps, sz=dz/steps;
            for(var i=0;i<steps;i++){
              var vx=sx,vz=sz;
              for(var pass=0;pass<3;pass++){
                var tx=camera.position.x+vx, tz=camera.position.z+vz;
                if(canStand(tx,tz)){camera.position.x=tx;camera.position.z=tz;break;}
                var n=collisionNormal(tx,tz);if(!n)break;
                var inward=vx*n.x+vz*n.z;
                if(inward>=-0.000001)break;
                vx-=n.x*inward;vz-=n.z*inward;
                if(Math.hypot(vx,vz)<0.00001)break;
              }
            }
          }
          function isTyping(){var a=document.activeElement;
            return a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT");}
          function moveStep(dt){
            if(!camera||isTyping()||exitSequence)return;
            var f=(keys.w?1:0)-(keys.s?1:0)+joy.z, r=(keys.d?1:0)-(keys.a?1:0)+joy.x;
            if(Math.abs(f)<0.02&&Math.abs(r)<0.02)return;
            var L=Math.sqrt(f*f+r*r); if(L>1){f/=L;r/=L;}
            var fx=Math.sin(yaw), fz=Math.cos(yaw);
            var rx=Math.sin(yaw-Math.PI/2), rz=Math.cos(yaw-Math.PI/2);
            var d=SPEED*dt;
            slideMove((fx*f+rx*r)*d,(fz*f+rz*r)*d);
            camera.position.y=crouch?EYE_LOW:EYE;
          }'''

          old_umb = '''  var umbG=new THREE.Group();umbG.position.set(4.0,0,3.6);
            umbG.add(cyl(0.13,0.135,0.42,0x5a6470,0,0.21,0,20,0.6));
            var uRim=new THREE.Mesh(new THREE.TorusGeometry(0.132,0.011,8,22),
              new THREE.MeshStandardMaterial({color:0x6d7784,roughness:0.45,metalness:0.35}));
            uRim.rotation.x=Math.PI/2;uRim.position.y=0.42;umbG.add(uRim);
            [[0.045,0.03,0x2f3b52,0.10],[-0.04,-0.05,0x4a3340,-0.08]].forEach(function(u){
              umbG.add(put(cyl(0.017,0.017,0.86,u[2],0,0,0,10,0.72),u[0],0.55,u[1],u[3],0,u[3]*0.6));
              umbG.add(put(cyl(0.008,0.008,0.14,0x6b4c30,0,0,0,8,0.7),
                u[0]*2.6,0.99,u[1]*2.6,u[3],0,u[3]*0.6));
            });
            scene.add(umbG);
            var umbH=cyl(0.2,0.2,1.0,0xffffff,4.0,0.5,3.6,12);
            umbH.material.transparent=true;umbH.material.opacity=0;
            scene.add(hot(umbH,"decoy:umb","우산꽂이"));'''

          new_umb = '''  /* 열린 바스켓형 우산꽂이 + 접힌 우산 두 자루 */
            var umbG=new THREE.Group();umbG.position.set(4.15,0,3.62);
            var uMetal=0x59636d, uDark=0x39414a;
            umbG.add(cyl(0.15,0.15,0.035,uDark,0,0.022,0,24,0.5));
            [0.10,0.43].forEach(function(yy){
              var ring=new THREE.Mesh(new THREE.TorusGeometry(0.142,0.011,7,24),
                new THREE.MeshStandardMaterial({color:uMetal,roughness:0.42,metalness:0.42}));
              ring.rotation.x=Math.PI/2;ring.position.y=yy;umbG.add(ring);
            });
            for(var ui=0;ui<10;ui++){
              var ua=ui/10*Math.PI*2;
              var sl=cyl(0.007,0.007,0.31,uMetal,Math.cos(ua)*0.137,0.265,Math.sin(ua)*0.137,8,0.5);
              sl.material.metalness=0.38;sl.material.roughness=0.46;umbG.add(sl);
            }
            function addUmbrella(x,z,fabric,leanZ,leanX){
              var ug=new THREE.Group();ug.position.set(x,0,z);ug.rotation.z=leanZ;ug.rotation.x=leanX;
              var shaft=cyl(0.009,0.009,1.00,0x3e342a,0,0.55,0,10,0.55);ug.add(shaft);
              var cloth=new THREE.Mesh(new THREE.ConeGeometry(0.064,0.62,12),
                new THREE.MeshStandardMaterial({color:fabric,roughness:0.88}));
              cloth.position.y=0.43;cloth.rotation.x=Math.PI;ug.add(cloth);
              var ferrule=cyl(0.006,0.004,0.10,0x302923,0,0.075,0,8,0.55);ug.add(ferrule);
              var hook=new THREE.Mesh(new THREE.TorusGeometry(0.047,0.009,7,18,Math.PI*1.12),
                new THREE.MeshStandardMaterial({color:0x6b4c30,roughness:0.56}));
              hook.position.set(-0.044,1.035,0);hook.rotation.z=-0.18;ug.add(hook);
              umbG.add(ug);
            }
            addUmbrella(0.038,0.018,0x2f3b52, 0.085,-0.035);
            addUmbrella(-0.042,-0.035,0x583848,-0.070, 0.045);
            scene.add(umbG);
            var umbH=cyl(0.23,0.23,1.08,0xffffff,4.15,0.54,3.62,12);
            umbH.material.transparent=true;umbH.material.opacity=0;
            scene.add(hot(umbH,"decoy:umb","우산꽂이"));'''

          if s.count(old_move) != 1:
              raise SystemExit(f'movement block count={s.count(old_move)}')
          if s.count(old_umb) != 1:
              raise SystemExit(f'umbrella block count={s.count(old_umb)}')
          s = s.replace(old_move, new_move).replace(old_umb, new_umb)
          p.write_text(s, encoding='utf-8')

          out = p.read_text(encoding='utf-8')
          checks = ['function collisionNormal(x,z)', 'function slideMove(dx,dz)', '열린 바스켓형 우산꽂이', 'umbG.position.set(4.15,0,3.62)']
          for q in checks:
              if q not in out: raise SystemExit('missing: '+q)
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve wall sliding and umbrella stand"
          git push
