name: Refine puzzle references and terminal

on:
  push:
    paths:
      - .github/workflows/refine-puzzles-and-terminal.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch puzzle references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) Sports sheet: remove weight-rule giveaway and give every sport a distinct real rule.
          sports='''var SPORTS=[
 {id:"soccer",name:"축구",en:"soccer, 蹴球",players:11,
  rule:"필드 플레이어는 손과 팔로 공을 다룰 수 없으며, 상대 골문 안으로 공을 보내 득점한다.",
  roles:["골키퍼(goalkeeper)","센터백(centre-back)","스위퍼(sweeper)","풀백(full-back)","윙백(wing-back)","중앙 미드필더(central midfielder)","수비형 미드필더(defensive midfielder)","공격형 미드필더(attacking midfielder)","윙어(winger)","중앙 공격수(centre forward)","세컨드 스트라이커(second striker)"]},
 {id:"basketball",name:"농구",en:"basketball, 籠球",players:5,
  rule:"공을 들고 이동할 때는 드리블해야 하며, 슛 위치와 상황에 따라 1·2·3점을 얻는다.",
  roles:["포인트 가드(point guard)","슈팅 가드(shooting guard)","스몰 포워드(small forward)","파워 포워드(power forward)","센터(center)"]},
 {id:"baseball",name:"야구",en:"baseball, 野球",players:9,
  rule:"공격과 수비를 번갈아 진행하며, 타자가 베이스를 돌아 홈에 들어오면 득점한다.",
  roles:["투수(pitcher)","포수(catcher)","1루수(first baseman)","2루수(second baseman)","3루수(third baseman)","유격수(shortstop)","좌익수(left fielder)","중견수(center fielder)","우익수(right fielder)","지명타자(designated hitter)"]},
 {id:"rowing",name:"조정",en:"rowing, 漕艇",players:9,
  rule:"에이트에서는 8명의 조수가 노를 젓고, 타수(coxswain)가 보트의 방향과 선수들의 호흡·리듬을 지시한다.",
  roles:["스트로크(stroke)","7번(seven)","6번(six)","5번(five)","4번(four)","3번(three)","2번(two)","바우(bow)","타수(coxswain)"]}
];'''
          pat=r'var SPORTS=\[.*?\n\];(?=\n\nvar CIPHER=)'
          s,n=re.subn(pat,sports,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'SPORTS block replace count={n}')

          old="'<dl><dt>한 팀 인원</dt><dd>'+s.players+'명</dd><dt>체중 규정</dt><dd>'+s.weight+'</dd>'+\n          '<dt>포지션</dt><dd>'+s.roles.join(\", \")+'</dd></dl>'"
          new="'<dl><dt>한 팀 인원</dt><dd>'+s.players+'명</dd><dt>주요 규칙</dt><dd>'+s.rule+'</dd>'+\n          '<dt>포지션</dt><dd>'+s.roles.join(\", \")+'</dd></dl>'"
          if s.count(old)!=1: raise SystemExit(f'sports render block count={s.count(old)}')
          s=s.replace(old,new,1)

          # 2) Restore a visual reasoning sketch to Chapter 4 without writing the answer itself.
          css_marker='.paper .sign{text-align:right;font-style:italic;color:#6f6250}'
          sketch_css='''\n/* 4장 — 특이점과 시간 역전을 비교하는 손그림 메모 */
.cosmo-sketch{margin:22px auto 26px;padding:12px 10px 8px;border:1px solid rgba(96,72,42,.34);border-radius:2px;
  background:rgba(255,255,255,.28);transform:rotate(-.35deg);max-width:680px}
.cosmo-sketch svg{display:block;width:100%;height:auto;overflow:visible;color:#3c3023}
.cosmo-sketch .ink{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cosmo-sketch .fine{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 7;opacity:.72}
.cosmo-sketch .dot{fill:#2a2118}.cosmo-sketch text{fill:#453628;font-family:var(--font-hand);font-size:20px}
.cosmo-sketch .small{font-size:15px;opacity:.78}.cosmo-sketch .redink{fill:var(--pen);font-weight:700}'''
          if css_marker not in s: raise SystemExit('paper sign CSS marker missing')
          if '.cosmo-sketch{' not in s:
              s=s.replace(css_marker,css_marker+sketch_css,1)

          diary_anchor=" '<p>그러나 나는 다른 곳에 더 관심이 있다.</p>'+\n"
          sketch=""" '<p>그러나 나는 다른 곳에 더 관심이 있다.</p>'+\n '<div class=\"cosmo-sketch\" aria-label=\"별의 붕괴와 시간을 거꾸로 돌린 모습을 비교한 메모\">'+\n '<svg viewBox=\"0 0 720 220\" role=\"img\" aria-label=\"별이 한 점으로 붕괴하는 모습과 한 점에서 바깥으로 퍼져 나가는 모습을 나란히 그린 그림\">'+\n '<text x=\"105\" y=\"30\">별의 붕괴</text><text x=\"557\" y=\"30\">반대 방향</text>'+\n '<circle class=\"ink\" cx=\"105\" cy=\"112\" r=\"47\"/><path class=\"ink\" d=\"M48 70l31 25M45 112h38M50 154l29-24M162 70l-31 25M165 112h-38M160 154l-29-24\"/>'+\n '<path class=\"ink\" d=\"M175 112h70\"/><path class=\"ink\" d=\"M228 100l17 12-17 12\"/><circle class=\"dot\" cx=\"275\" cy=\"112\" r=\"8\"/><text class=\"small\" x=\"250\" y=\"145\">특이점</text>'+\n '<path class=\"fine\" d=\"M317 70c25-42 61-42 86 0\"/><path class=\"ink\" d=\"M397 57l7 13-15 1\"/><text class=\"redink\" x=\"319\" y=\"104\">시간을 거꾸로</text>'+\n '<circle class=\"dot\" cx=\"455\" cy=\"112\" r=\"8\"/><path class=\"ink\" d=\"M485 112h75M544 100l17 12-17 12\"/>'+\n '<circle class=\"ink\" cx=\"626\" cy=\"112\" r=\"47\"/><path class=\"ink\" d=\"M590 81l-25-20M586 112h-38M590 143l-25 20M662 81l25-20M666 112h38M662 143l25 20\"/>'+\n '<text class=\"small\" x=\"550\" y=\"191\">한 점에서 바깥으로 퍼져 나간다면?</text>'+\n '</svg></div>'+\n"""
          if 'class="cosmo-sketch"' not in s:
              if s.count(diary_anchor)!=1: raise SystemExit(f'diary4 anchor count={s.count(diary_anchor)}')
              s=s.replace(diary_anchor,sketch,1)

          # 3) While answering at the terminal, keep the current chapter letter visible at left.
          modal_css_marker='#modal .card{width:100%;max-height:calc(100dvh - 24px - var(--sa-t) - var(--sa-b));pointer-events:auto;'
          companion_css='''\n#terminal-companion{position:fixed;z-index:59;left:calc(var(--sa-l) + 12px);top:calc(var(--sa-t) + 12px);\n  width:min(43vw,650px);max-height:calc(100dvh - var(--sa-t) - var(--sa-b) - 24px);overflow:auto;\n  padding:0;border-radius:4px;box-shadow:0 18px 48px rgba(0,0,0,.48);overscroll-behavior:contain}\n#terminal-companion .terminal-companion-head{position:sticky;top:0;z-index:2;padding:9px 14px;\n  background:#21180e;color:#d8bd88;border:1px solid rgba(214,186,136,.22);font-size:11px;font-weight:800;letter-spacing:.12em}\n#terminal-companion .paper{padding:18px 22px;font-size:13px;line-height:1.72;box-shadow:none}\n#terminal-companion .paper p{margin:0 0 10px}\nbody.touch #terminal-companion{left:calc(var(--sa-l) + 8px);top:calc(var(--sa-t) + 8px);width:42vw;\n  max-height:calc(100dvh - var(--sa-t) - var(--sa-b) - 16px)}\nbody.touch #terminal-companion .paper{padding:13px 16px;font-size:11.5px;line-height:1.58}\n@media(max-width:760px){#terminal-companion{width:40vw}#terminal-companion .paper{font-size:11px;padding:12px}}\n'''
          if modal_css_marker not in s: raise SystemExit('modal CSS marker missing')
          if '#terminal-companion{' not in s:
              s=s.replace(modal_css_marker,companion_css+modal_css_marker,1)

          open_old='''var modalAfterClose=null;\nfunction openModal(title,sub,build,afterClose,closeText){\n  $(\"#m-title\").textContent=title;$(\"#m-sub\").textContent=sub||\"\";'''
          open_new='''var modalAfterClose=null;\nfunction clearTerminalCompanion(){\n  var old=document.getElementById(\"terminal-companion\");\n  if(old)old.remove();\n}\nfunction showTerminalCompanion(c){\n  clearTerminalCompanion();\n  if(!c||!c.diary)return;\n  var host=el(\"aside\",\"terminal-companion\");host.id=\"terminal-companion\";\n  host.appendChild(el(\"div\",\"terminal-companion-head\",\"CHAPTER \"+c.n+\" · 편지\"));\n  host.appendChild(el(\"article\",\"paper\",DIARY_HTML[c.diary]));\n  document.body.appendChild(host);\n}\nfunction openModal(title,sub,build,afterClose,closeText){\n  clearTerminalCompanion();\n  $(\"#m-title\").textContent=title;$(\"#m-sub\").textContent=sub||\"\";'''
          if s.count(open_old)!=1: raise SystemExit(f'openModal block count={s.count(open_old)}')
          s=s.replace(open_old,open_new,1)

          close_old='''function closeModal(){\n  $$(\"#m-body video\").forEach(function(v){v.pause();});'''
          close_new='''function closeModal(){\n  clearTerminalCompanion();\n  $$(\"#m-body video\").forEach(function(v){v.pause();});'''
          if s.count(close_old)!=1: raise SystemExit(f'closeModal block count={s.count(close_old)}')
          s=s.replace(close_old,close_new,1)

          terminal_anchor='''    if(S.phase===\"search\"){\n      b.innerHTML='<div class=\"term\"><div class=\"l\">ACCEPTED</div>'+\n        '<div class=\"cue\">'+c.cue+'</div></div>';\n      return;\n    }\n    var t=el(\"div\",\"term\");'''
          terminal_new='''    if(S.phase===\"search\"){\n      b.innerHTML='<div class=\"term\"><div class=\"l\">ACCEPTED</div>'+\n        '<div class=\"cue\">'+c.cue+'</div></div>';\n      return;\n    }\n    showTerminalCompanion(c);\n    var t=el(\"div\",\"term\");'''
          if s.count(terminal_anchor)!=1: raise SystemExit(f'terminal answer anchor count={s.count(terminal_anchor)}')
          s=s.replace(terminal_anchor,terminal_new,1)

          p.write_text(s,encoding='utf-8')

          out=p.read_text(encoding='utf-8')
          checks=[
            '<dt>주요 규칙</dt><dd>'+"'"+'+s.rule+'+"'"+'</dd>',
            '타수(coxswain)가 보트의 방향과 선수들의 호흡·리듬을 지시한다.',
            'class="cosmo-sketch"',
            'function showTerminalCompanion(c){',
            'showTerminalCompanion(c);',
            '#terminal-companion{'
          ]
          for q in checks:
              if q not in out: raise SystemExit('missing '+q)
          if '체중 규정' in out: raise SystemExit('weight rule label still remains')
          if 'weight:"' in out: raise SystemExit('sports weight fields still remain')
          print('sports + chapter4 sketch + terminal companion validation ok')
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re,pathlib,subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/game.js').write_text('\n'.join(blocks),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/game.js'],check=True)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine puzzle references and terminal layout"
          git push
