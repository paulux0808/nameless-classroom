name: Apply uploaded index baseline

on:
  push:
    paths:
      - '.github/workflows/apply-uploaded-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact uploaded index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p0=Path('.tmp-upload/p00').read_text()
          p0=p0[:395]+'U'+p0[395:]
          parts=[p0]+[Path(f'.tmp-upload/p{i:02d}').read_text() for i in range(1,6)]
          Path('/tmp/index.patch.b64').write_text(''.join(parts))
          PY
          echo '2e7193eb8e9401a2338402781a8d2426c0644428c2c639304941452a3ceb7c93  /tmp/index.patch.b64' | sha256sum -c -
          base64 -d /tmp/index.patch.b64 > /tmp/index.patch.gz
          gzip -t /tmp/index.patch.gz
          gzip -dc /tmp/index.patch.gz > /tmp/index.patch
          git apply --check /tmp/index.patch
          git apply /tmp/index.patch
          echo '51d40640061e7c42251a54bd3b2c0f6702444fcfe2354935b1270d858b6cb942  index.html' | sha256sum -c -
          test "$(git hash-object index.html)" = 'a6833a7890429b16e6aa1ba4fa17643255ae012f'
          rm -rf .tmp-upload
          git rm --ignore-unmatch .github/workflows/apply-uploaded-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use uploaded index-2.html as baseline'
          git push
