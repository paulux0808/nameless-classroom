name: Apply uploaded index-2

on:
  push:
    paths:
      - .github/workflows/apply-index2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact uploaded index-2 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/index.patch.gz.b64 <<'EOF'
[... ELLIPSIZATION ...]
EOF
          base64 -d /tmp/index.patch.gz.b64 | gzip -d > /tmp/index.patch
          git apply --check /tmp/index.patch
          git apply /tmp/index.patch
          test "$(sha256sum index.html | awk '{print $1}')" = "51d40640061e7c42251a54bd3b2c0f6702444fcfe2354935b1270d858b6cb942"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use uploaded index-2 as baseline"
          git push
