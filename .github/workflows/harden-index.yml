name: Harden index spoilers

on:
  push:
    paths:
      - '.github/workflows/harden-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden index
        run: |
          sed -i "/if 'c.era+' in s:/d" .github/scripts/harden_index.py
          python3 .github/scripts/harden_index.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('openModal(c.title,c.era+" · 일기",function(b){','openModal(c.title,"기록 · 일기",function(b){')
          if 'c.era' in s:
              raise SystemExit('chapter era reference still remains')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify spoiler cleanup
        run: |
          ! grep -q 'era:"1942"' index.html
          ! grep -q '1942년 1월 8일' index.html
          ! grep -q 'STEPHEN WILLIAM HAWKING' index.html
          ! grep -q 'ans:\["94218"\]' index.html
          ! grep -q 'ans:\["einstein"\]' index.html
          ! grep -q 'var STACK_ORDER' index.html
          ! grep -q 'c.era' index.html
          grep -q 'sealCode(v,c.n)' index.html
          grep -q 'stackOrder()' index.html
      - name: Commit hardened index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hide puzzle spoilers in index'
          git push origin HEAD:main
