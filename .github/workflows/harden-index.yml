name: Harden index spoilers

on:
  push:
    paths:
      - '.github/workflows/harden-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden index
        run: python3 .github/scripts/harden_index.py
      - name: Verify spoiler cleanup
        run: |
          ! grep -q 'era:"1942"' index.html
          ! grep -q 'STEPHEN WILLIAM HAWKING' index.html
          ! grep -q 'ans:\["94218"\]' index.html
          ! grep -q 'var STACK_ORDER' index.html
          grep -q 'sealCode(v,c.n)' index.html
          grep -q 'stackOrder()' index.html
      - name: Commit hardened index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hide puzzle spoilers in index'
          git push origin HEAD:main
