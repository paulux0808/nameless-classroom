name: Fix frame color space

on:
  push:
    paths:
      - .github/workflows/fix-frame-color-space.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portrait frame color lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # One material factory for both initial frame backing and bars recreated after clicks.
          marker='function drawFrameBars(id){'
          helper='''function portraitFrameMat(){\n  var m=new THREE.MeshBasicMaterial({color:0x8a6134});\n  m.color.convertSRGBToLinear();\n  m.userData=m.userData||{};\n  m.userData.colorAlreadyLinear=true;\n  return m;\n}\n'''
          if 'function portraitFrameMat(){' not in s:
              if s.count(marker)!=1:
                  raise SystemExit(f'drawFrameBars marker count={s.count(marker)}')
              s=s.replace(marker,helper+marker,1)

          old='var frameBase=plane(0.66,0.76,new THREE.MeshBasicMaterial({color:0x8a6134}),0,0,0.006);'
          new='var frameBase=plane(0.66,0.76,portraitFrameMat(),0,0,0.006);'
          if s.count(old)!=1:
              raise SystemExit(f'frameBase old count={s.count(old)}')
          s=s.replace(old,new,1)

          old='''  var W=0.66,H=0.76,TK=0.105,TN=0.074;\n  var frameCol=0x8a6134;\n  function bar(w,h,x,y,thick){\n    var mat=new THREE.MeshBasicMaterial({color:frameCol});\n    var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,thick?0.042:0.03),mat);'''
          new='''  var W=0.66,H=0.76,TK=0.105,TN=0.074;\n  function bar(w,h,x,y,thick){\n    var mat=portraitFrameMat();\n    var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,thick?0.042:0.03),mat);'''
          if s.count(old)!=1:
              raise SystemExit(f'frame bar material block count={s.count(old)}')
          s=s.replace(old,new,1)

          old='if(m&&!Array.isArray(m)&&m.color&&seen.indexOf(m)<0){seen.push(m);m.color.convertSRGBToLinear();}'
          new='''if(m&&!Array.isArray(m)&&m.color&&seen.indexOf(m)<0){\n      seen.push(m);\n      if(!(m.userData&&m.userData.colorAlreadyLinear))m.color.convertSRGBToLinear();\n    }'''
          if s.count(old)!=1:
              raise SystemExit(f'polish color conversion block count={s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          out=p.read_text(encoding='utf-8')
          checks=[
              'function portraitFrameMat(){',
              'm.color.convertSRGBToLinear();',
              'm.userData.colorAlreadyLinear=true;',
              'var frameBase=plane(0.66,0.76,portraitFrameMat(),0,0,0.006);',
              'var mat=portraitFrameMat();',
              'if(!(m.userData&&m.userData.colorAlreadyLinear))m.color.convertSRGBToLinear();'
          ]
          for q in checks:
              if q not in out: raise SystemExit('missing '+q)
          if 'new THREE.MeshBasicMaterial({color:frameCol})' in out:
              raise SystemExit('old runtime frame material remains')
          if out.count('color:0x8a6134')!=1:
              raise SystemExit(f'unexpected frame color literal count={out.count("color:0x8a6134")}')
          print('frame color lifecycle validation ok')
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re,pathlib,subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/game.js').write_text('\n'.join(blocks),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/game.js'],check=True)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Keep portrait frame color stable on redraw"
          git push
