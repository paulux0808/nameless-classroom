name: Build stage two transition

on:
  push:
    paths:
      - .github/workflows/stage2-transition.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply transition patch
        run: python .tmp-stage2-transition.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re,pathlib,subprocess
          for name in ['index.html','stage2.html']:
            s=pathlib.Path(name).read_text(encoding='utf-8')
            blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
            pathlib.Path('/tmp/'+name+'.js').write_text('\n'.join(blocks),encoding='utf-8')
            subprocess.run(['node','--check','/tmp/'+name+'.js'],check=True)
          PY
      - name: Verify files
        run: |
          test -s stage2.html
          test ! -e einstein.html
          grep -q 'PROJECT ███████' stage2.html
          grep -q '1943' stage2.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html stage2.html
          git rm -f --ignore-unmatch einstein.html
          git diff --cached --quiet && exit 0
          git commit -m "Start the next nameless project after a black fade"
          git push
