name: Fix reference layout and assembly

on:
  push:
    paths:
      - .github/workflows/fix-reference-layout-and-assembly.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) Map: fit all six columns inside the modal instead of forcing a 600px canvas.
          old='''.mapwrap{overflow:auto}
          .mapgrid{display:grid;grid-template-columns:repeat(6,minmax(92px,1fr));gap:7px;min-width:600px}
          .mc.blank{background:#c9743f;opacity:.55}
          .mc{min-height:54px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:#d4703a;color:#fff;
            font-size:10px;font-weight:800;line-height:1.25;display:grid;place-items:center;text-align:center;padding:5px;position:relative}
          .mc.void{visibility:hidden}'''
          new='''.mapwrap{overflow:visible;width:100%}
          .mapgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;width:100%;min-width:0}
          .mc.blank{background:#c9743f;opacity:.55}
          .mc{min-width:0;min-height:44px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:#d4703a;color:#fff;
            font-size:clamp(8px,1.05vw,10px);font-weight:800;line-height:1.15;display:grid;place-items:center;text-align:center;
            padding:4px 2px;position:relative;overflow-wrap:anywhere;word-break:break-word}
          .mc.void{visibility:hidden}
          .maproutes{margin:10px 0 0;padding-left:19px;font-size:11.5px;line-height:1.45}
          .maproutes li+li{margin-top:3px}'''
          if old not in s: raise SystemExit('map css block not found')
          s=s.replace(old,new,1)

          # 2) Assembly: final diary and pieces visible together; pieces viewed from a gentler, slightly-above angle.
          anchor='''.stack.locked .srow{grid-template-columns:1fr}
          video{display:block;width:100%;border-radius:10px;background:#000;max-height:52vh;max-height:46dvh}'''
          repl='''.stack.locked .srow{grid-template-columns:1fr}
          #modal.assembly-modal{width:min(1040px,92vw)}
          body.touch #modal.assembly-modal{width:min(980px,94vw)}
          .assembly-layout{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(360px,1.1fr);gap:18px;align-items:start}
          .assembly-diary .paper{padding:18px 20px;font-size:13px;line-height:1.7;max-height:calc(100dvh - 150px);overflow:auto}
          .assembly-diary .paper p{margin-bottom:11px}
          .assembly-stackview{perspective:1000px;padding:6px 4px 12px;overflow:hidden}
          .assembly-stackview .stack{padding-left:10px;transform:rotateX(5deg);transform-origin:50% 0}
          .assembly-stackview .bar .face{transform:skewX(-18deg)}
          .assembly-stackview .bar .face > *{transform:skewX(18deg)}
          @media(max-width:760px){
            #modal.assembly-modal,body.touch #modal.assembly-modal{width:min(620px,96vw)}
            .assembly-layout{grid-template-columns:1fr;gap:12px}
            .assembly-diary .paper{max-height:34dvh}
          }
          video{display:block;width:100%;border-radius:10px;background:#000;max-height:52vh;max-height:46dvh}'''
          if anchor not in s: raise SystemExit('assembly css anchor not found')
          s=s.replace(anchor,repl,1)

          # 3) Sports: every listed position gets English; remove explanatory body/correction text from the cards.
          role_replacements={
            'roles:["골키퍼","센터백","스위퍼","풀백","윙백","중앙 미드필더","수비형 미드필더","공격형 미드필더","윙어","중앙 공격수","세컨드 스트라이커"]':
            'roles:["골키퍼(goalkeeper)","센터백(centre-back)","스위퍼(sweeper)","풀백(full-back)","윙백(wing-back)","중앙 미드필더(central midfielder)","수비형 미드필더(defensive midfielder)","공격형 미드필더(attacking midfielder)","윙어(winger)","중앙 공격수(centre forward)","세컨드 스트라이커(second striker)"]',
            'roles:["포인트 가드","슈팅 가드","스몰 포워드","파워 포워드","센터"]':
            'roles:["포인트 가드(point guard)","슈팅 가드(shooting guard)","스몰 포워드(small forward)","파워 포워드(power forward)","센터(center)"]',
            'roles:["투수","포수","1루수","2루수","3루수","유격수","좌익수","중견수","우익수"]':
            'roles:["투수(pitcher)","포수(catcher)","1루수(first baseman)","2루수(second baseman)","3루수(third baseman)","유격수(shortstop)","좌익수(left fielder)","중견수(center fielder)","우익수(right fielder)"]',
            'roles:["조수(bow)","2번","3번","4번","5번","6번","7번","정조(스트로크)","타수(coxswain)"]':
            'roles:["조수(bow)","2번(two seat)","3번(three seat)","4번(four seat)","5번(five seat)","6번(six seat)","7번(seven seat)","정조(stroke)","타수(coxswain)"]'
          }
          for a,b in role_replacements.items():
              if a not in s: raise SystemExit('sports role block not found: '+a[:30])
              s=s.replace(a,b,1)

          old_sport='''        add(s.name+' <span style="color:var(--dim);font-weight:400">'+s.en+'</span>',
          '<dl><dt>한 팀 인원</dt><dd>'+s.players+'명</dd><dt>체중 규정</dt><dd>'+s.weight+'</dd>'+
          '<dt>포지션</dt><dd>'+s.roles.join(", ")+'</dd></dl><p style="margin:10px 0 0">'+s.note+'</p>'+
          (s.fix?'<p style="margin:8px 0 0;color:var(--danger);font-size:11px">※ '+s.fix+'</p>':''));'''
          new_sport='''        add(s.name+' <span style="color:var(--dim);font-weight:400">'+s.en+'</span>',
          '<dl><dt>한 팀 인원</dt><dd>'+s.players+'명</dd><dt>체중 규정</dt><dd>'+s.weight+'</dd>'+
          '<dt>포지션</dt><dd>'+s.roles.join(", ")+'</dd></dl>');'''
          if old_sport not in s: raise SystemExit('sports render block not found')
          s=s.replace(old_sport,new_sport,1)

          # 4) Map: render route instructions exactly once. Remove duplicate details/body copy.
          old_map='''      mw.appendChild(mg);b.appendChild(mw);
      var ol=el("ol");ol.style.cssText="margin:16px 0 0;padding-left:20px;font-size:13px;line-height:1.9";
      ol.innerHTML=MAP_ROUTES.map(function(x){return '<li>'+x.t+'</li>';}).join("");
      b.appendChild(ol);
      add("신부가 건넨 지도",
        '<ol style="margin:6px 0 0;padding-left:18px">'+MAP_ROUTES.map(function(r){return '<li>'+r.t+'</li>';}).join("")+
        '</ol><p style="margin:10px 0 0">일곱 장소를 순서대로 모두 확인해야 한다.</p>');'''
          new_map='''      mw.appendChild(mg);b.appendChild(mw);
      var ol=el("ol","maproutes");
      ol.innerHTML=MAP_ROUTES.map(function(x){return '<li>'+x.t+'</li>';}).join("");
      b.appendChild(ol);'''
          if old_map not in s: raise SystemExit('map render block not found')
          s=s.replace(old_map,new_map,1)

          # 5) Assembly modal: show the last diary beside the stack and keep a stable slightly-above presentation.
          old_assembly='''function showAssembly(){
  if(!S.stack)S.stack=[1,2,3,4,5,6,7,8];
  openModal("기억을 쌓다","마지막 조각",function(b){
    var host=el("div");b.appendChild(host);
    var term=el("div");b.appendChild(term);
    var wasLocked=false;'''
          new_assembly='''function showAssembly(){
  if(!S.stack)S.stack=[1,2,3,4,5,6,7,8];
  $("#modal").classList.add("assembly-modal");
  openModal("기억을 쌓다","마지막 일기를 보며 기억 조각을 맞추세요",function(b){
    var layout=el("div","assembly-layout");
    var diaryCol=el("div","assembly-diary");
    diaryCol.appendChild(el("article","paper",DIARY_HTML.diary9));
    var work=el("div","assembly-stackview");
    var host=el("div");work.appendChild(host);
    var term=el("div");work.appendChild(term);
    layout.appendChild(diaryCol);layout.appendChild(work);b.appendChild(layout);
    var wasLocked=false;'''
          if old_assembly not in s: raise SystemExit('showAssembly head not found')
          s=s.replace(old_assembly,new_assembly,1)

          old_close='''  $("#modal").classList.add("hidden");
  $("#modal [data-x]").textContent="닫기";'''
          new_close='''  $("#modal").classList.add("hidden");
  $("#modal").classList.remove("assembly-modal");
  $("#modal [data-x]").textContent="닫기";'''
          if old_close not in s: raise SystemExit('closeModal block not found')
          s=s.replace(old_close,new_close,1)

          p.write_text(s,encoding='utf-8')

          # Static validation.
          out=p.read_text(encoding='utf-8')
          checks=[
            'grid-template-columns:repeat(6,minmax(0,1fr))',
            'var ol=el("ol","maproutes")',
            '골키퍼(goalkeeper)', '포인트 가드(point guard)', '투수(pitcher)', '2번(two seat)',
            'classList.add("assembly-modal")', 'DIARY_HTML.diary9', 'assembly-stackview'
          ]
          for q in checks:
              if q not in out: raise SystemExit('missing after patch: '+q)
          if '일곱 장소를 순서대로 모두 확인해야 한다.</p>' in out:
              raise SystemExit('duplicate map body still present')
          # Only one route-list renderer should remain inside the map branch.
          branch=out[out.index('}else if(p==="map"){'):out.index('}else if(p==="video"){')]
          if branch.count('MAP_ROUTES.map') != 1:
              raise SystemExit('map routes render count='+str(branch.count('MAP_ROUTES.map')))
          if 's.note' in out[out.index('}else if(p==="sport"){'):out.index('}else if(p==="map"){')]:
              raise SystemExit('sport body note still rendered')

      - name: Check JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          if not blocks: raise SystemExit('no script blocks')
          Path('/tmp/game.js').write_text('\n'.join(blocks),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/game.js'],check=True)

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix reference layouts and final assembly"
          git push
