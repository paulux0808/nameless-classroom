name: Fix reference layout and assembly

on:
  push:
    paths:
      - .github/workflows/fix-reference-layout-and-assembly.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI fixes
        run: python .github/scripts/patch-reference-layout.py
      - name: Check JavaScript syntax
        run: python -c "import re,pathlib,subprocess;s=pathlib.Path('index.html').read_text(encoding='utf-8');b=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S);pathlib.Path('/tmp/game.js').write_text('\\n'.join(b),encoding='utf-8');subprocess.run(['node','--check','/tmp/game.js'],check=True)"
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix reference layouts and final assembly"
          git push
