<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>다음 스테이지 — 준비중</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020303;color:#d8d4ca;overflow:hidden}
body{display:grid;place-items:center;padding:24px;font-family:"Courier New",ui-monospace,monospace;background:radial-gradient(circle at 50% 42%,#111314 0,#060708 38%,#020303 72%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 4px),radial-gradient(circle at 50% 50%,transparent 38%,rgba(0,0,0,.72) 100%)}
.card{position:relative;width:min(760px,92vw);padding:clamp(34px,7vw,74px);text-align:center;border:1px solid rgba(208,170,105,.2);background:linear-gradient(180deg,rgba(12,15,15,.96),rgba(5,7,7,.98));box-shadow:0 28px 90px rgba(0,0,0,.7)}
.kicker{font-size:9px;letter-spacing:.32em;color:#706956;margin-bottom:22px}.title{margin:0;font-size:clamp(34px,7vw,72px);font-weight:400;letter-spacing:.08em;color:#d3c9ad}.rule{width:72px;height:1px;background:rgba(208,170,105,.42);margin:28px auto}.soon{font-size:clamp(20px,3vw,30px);letter-spacing:.2em;font-weight:800;margin:0 0 14px;color:#c2b58f}.desc{margin:0 auto;color:#817967;font:14px/1.85 system-ui,sans-serif;max-width:520px}.back{display:inline-flex;align-items:center;justify-content:center;margin-top:34px;min-height:42px;padding:0 16px;color:#aaa08a;text-decoration:none;border:1px solid rgba(208,170,105,.18);font-size:11px;letter-spacing:.1em;background:rgba(255,255,255,.018)}
</style>
</head>
<body>
<main class="card">
  <div class="kicker">NAMELESS CLASSROOM · NEXT PROJECT</div>
  <h1 class="title">PROJECT ███████</h1>
  <div class="rule"></div>
  <p class="soon">준비중</p>
  <p class="desc">다음 교실을 준비하고 있습니다.<br>새 스테이지는 제작이 완료된 뒤 공개됩니다.</p>
  <a class="back" href="index.html">이전 스테이지로 돌아가기</a>
</main>
</body>
</html>
