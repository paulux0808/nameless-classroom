<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NAMELESS Ⅱ — Chapter 01 : Richard / Calculation Chain</title>

<style>
/* ---------------------------- 1943 테마 & 비주얼 토큰 ---------------------------- */
:root {
  --bg: #090a0b;
  --panel: rgba(14, 16, 17, 0.88);
  --panel-solid: #161819;
  --line: rgba(205, 175, 125, 0.25);
  --line-hi: rgba(230, 195, 140, 0.55);
  --paper: #e7dfcc;
  --paper-card: #f2ebd9;
  --paper-dark: #212423;
  --ink: #1e1d1a;
  --ink-red: #9e2a22;
  --ink-blue: #1d3f66;
  --accent: #c89d55;
  --accent-glow: rgba(200, 157, 85, 0.35);
  --text: #ede7db;
  --text-dim: #9da09c;
  --tap: 56px;
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-r: env(safe-area-inset-right, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  user-select: none; -webkit-user-select: none;
}

#scene { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }

/* ---------------------------- HUD & 오버레이 ---------------------------- */
#reticle {
  position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
  border-radius: 50%; background: rgba(255, 255, 255, 0.75);
  transform: translate(-50%, -50%); pointer-events: none; z-index: 30;
  transition: transform 0.15s ease, background 0.15s ease;
}
#reticle.active {
  transform: translate(-50%, -50%) scale(2.4);
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
}

#label {
  position: fixed; left: 50%; top: calc(50% + 28px); transform: translateX(-50%);
  padding: 8px 18px; border-radius: 8px;
  background: rgba(12, 14, 15, 0.85); border: 1px solid var(--line-hi);
  font-size: 16px; font-weight: 500; letter-spacing: 0.05em; color: var(--text);
  pointer-events: none; z-index: 30; opacity: 0; transition: opacity 0.15s ease;
  white-space: nowrap; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
}
#label.show { opacity: 1; }

#hud {
  position: fixed; inset: 0; pointer-events: none; z-index: 20;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: calc(var(--sa-t) + 20px) calc(var(--sa-r) + 24px) calc(var(--sa-b) + 20px) calc(var(--sa-l) + 24px);
}

.hud-top {
  display: flex; justify-content: space-between; align-items: flex-start;
}

.chapter-badge {
  background: var(--panel); border: 1px solid var(--line);
  padding: 10px 22px; border-radius: 8px; backdrop-filter: blur(8px);
  pointer-events: auto; display: flex; flex-direction: column; gap: 4px;
}
.chapter-tag { font-size: 13px; letter-spacing: 0.16em; color: var(--accent); font-weight: 700; text-transform: uppercase; }
.chapter-title { font-size: 20px; font-weight: 600; color: #fff; letter-spacing: 0.04em; }

.objective-box {
  background: var(--panel); border: 1px solid var(--line-hi);
  padding: 14px 28px; border-radius: 8px; backdrop-filter: blur(8px);
  max-width: min(650px, 80vw); text-align: right;
  font-size: 17px; line-height: 1.5; color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); pointer-events: auto;
}
.objective-label { font-size: 12px; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }

/* ---------------------------- 대화 자막 바 ---------------------------- */
#dialogue-bar {
  position: fixed; left: 50%; bottom: max(32px, calc(var(--sa-b) + 20px));
  transform: translateX(-50%); width: min(880px, 90vw);
  background: rgba(11, 13, 14, 0.92); border: 1px solid var(--line-hi);
  border-radius: 12px; padding: 18px 28px; z-index: 40;
  backdrop-filter: blur(12px); box-shadow: 0 16px 40px rgba(0,0,0,0.8);
  pointer-events: auto; transition: opacity 0.25s ease, transform 0.25s ease;
  display: flex; flex-direction: column; gap: 6px;
}
#dialogue-bar.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, 20px); }
.diag-speaker { font-size: 14px; font-weight: 700; letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; }
.diag-text { font-size: 21px; line-height: 1.6; color: #fdfaf3; font-weight: 400; word-break: keep-all; }
.diag-hint { font-size: 13px; color: var(--text-dim); text-align: right; margin-top: 4px; }

/* ---------------------------- 우측 50vw 슬라이드 모달 (검토 서류) ---------------------------- */
#modal {
  position: fixed; inset: 0 0 0 auto; width: 50vw; max-width: 50vw;
  height: 100%; background: rgba(14, 16, 17, 0.95);
  border-left: 1px solid var(--line-hi); backdrop-filter: blur(16px);
  z-index: 60; display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: -16px 0 48px rgba(0,0,0,0.75);
}
#modal.open { transform: translateX(0); }

.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 24px 36px; border-bottom: 1px solid var(--line);
  background: rgba(20, 23, 24, 0.85);
}
.modal-header h2 { margin: 0; font-size: 26px; font-weight: 700; color: #fff; letter-spacing: 0.04em; }
.modal-header .sub { font-size: 15px; color: var(--accent); margin-top: 4px; }

.modal-close {
  background: transparent; border: 1px solid var(--line); color: var(--text);
  padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer;
  transition: all 0.2s;
}
.modal-close:hover { border-color: var(--accent); color: var(--accent); }

.modal-body {
  flex: 1; overflow-y: auto; padding: 36px; display: flex; flex-direction: column; gap: 28px;
}

/* 펀치카드 묶음 스타일 */
.punch-card-stack {
  display: flex; flex-direction: column; gap: 20px;
}

.punch-card {
  background: var(--paper-card); color: var(--ink); border-radius: 6px;
  padding: 24px 30px; position: relative; border: 1px solid #c2b59b;
  box-shadow: 0 6px 18px rgba(0,0,0,0.3); font-family: ui-monospace, "Courier New", monospace;
  transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer;
}
.punch-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,0.4); }
.punch-card.selected { border: 2px solid var(--ink-red); background: #fbf7ee; }

.card-top {
  display: flex; justify-content: space-between; align-items: baseline;
  border-bottom: 2px solid rgba(30, 29, 26, 0.15); padding-bottom: 10px; margin-bottom: 14px;
}
.card-id { font-size: 24px; font-weight: 800; letter-spacing: 0.08em; }
.card-meta { font-size: 16px; color: #5a544b; display: flex; gap: 16px; font-weight: 600; }
.card-batch { background: rgba(0,0,0,0.08); padding: 2px 8px; border-radius: 4px; }
.card-rev { padding: 2px 8px; border-radius: 4px; }
.card-rev.rev-a { background: #e0b8b4; color: #781912; }
.card-rev.rev-b { background: #b8d4c8; color: #16523c; }

.card-data-row {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 20px; margin: 8px 0;
}
.card-data-row .val { font-size: 26px; font-weight: 700; }
.card-arrow { color: #887d6b; font-size: 22px; }

/* 펀치 구멍 시각화 (80-column 펀치카드 장식) */
.punch-holes {
  display: flex; gap: 6px; margin-top: 16px; opacity: 0.45;
}
.punch-hole { width: 8px; height: 14px; background: #2b2824; border-radius: 2px; }

/* 직인 도장 날인 애니메이션 */
.stamp-imprint {
  position: absolute; right: 40px; top: 20px;
  border: 4px solid var(--ink-red); color: var(--ink-red);
  padding: 8px 18px; font-size: 26px; font-weight: 900; letter-spacing: 0.14em;
  transform: rotate(-8deg) scale(1); border-radius: 8px;
  text-transform: uppercase; pointer-events: none;
  animation: stampImpact 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
.stamp-imprint.approved {
  border-color: var(--ink-blue); color: var(--ink-blue);
  transform: rotate(6deg) scale(1);
}

@keyframes stampImpact {
  0% { transform: rotate(-8deg) scale(2.8); opacity: 0; }
  100% { transform: rotate(-8deg) scale(1); opacity: 1; }
}

/* 액션 툴바 */
.modal-actions {
  display: flex; gap: 16px; padding: 24px 36px; border-top: 1px solid var(--line);
  background: rgba(20, 23, 24, 0.95);
}
.btn-action {
  flex: 1; min-height: 54px; border: none; border-radius: 8px;
  font-size: 19px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer;
  transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-reject {
  background: #7a221b; color: #fff; border: 1px solid #a8382f;
}
.btn-reject:hover { background: #942b23; }
.btn-approve {
  background: #1c543f; color: #fff; border: 1px solid #287a5b;
}
.btn-approve:hover { background: #23694f; }
.btn-action:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.8); }

/* ---------------------------- 로딩 및 트랜지션 ---------------------------- */
#loading {
  position: fixed; inset: 0; z-index: 100;
  background: #090a0b; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
}
#loading.hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
.spinner {
  width: 44px; height: 44px; border: 3px solid rgba(200, 157, 85, 0.2);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.load-title { font-size: 22px; font-weight: 600; letter-spacing: 0.12em; color: var(--accent); }
.load-detail { font-size: 14px; color: var(--text-dim); }

/* 모바일 터치 컨트롤러 */
#joy-zone {
  position: fixed; left: max(20px, var(--sa-l)); bottom: max(20px, var(--sa-b));
  width: 140px; height: 140px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line);
  z-index: 25; touch-action: none; display: none;
}
#joy-knob {
  position: absolute; left: 50%; top: 50%; width: 54px; height: 54px;
  margin: -27px 0 0 -27px; border-radius: 50%;
  background: var(--accent); opacity: 0.65; pointer-events: none;
}
body.touch #joy-zone { display: block; }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="reticle"></div>
<div id="label"></div>

<!-- HUD -->
<div id="hud">
  <div class="hud-top">
    <div class="chapter-badge">
      <div class="chapter-tag">Chapter 01 · 1943 Los Alamos</div>
      <div class="chapter-title">Richard / Calculation Chain</div>
    </div>
    <div class="objective-box">
      <div class="objective-label">Current Task</div>
      <div id="objective-text">파인만이 제출한 계산 카드 묶음(Card 03 ~ 06)의 체인 연결을 검토하십시오.</div>
    </div>
  </div>
</div>

<!-- 대화 자막 -->
<div id="dialogue-bar" class="hidden">
  <div class="diag-speaker" id="diag-speaker">RICHARD</div>
  <div class="diag-text" id="diag-text">“박사님. 계산부에서 첫 결과가 나왔습니다. 한 번 확인해 주시죠.”</div>
  <div class="diag-hint">[클릭 또는 화면 탭으로 계속]</div>
</div>

<!-- 50vw 검토 서류 모달 -->
<div id="modal">
  <div class="modal-header">
    <div>
      <h2 id="modal-title">계산 체인 검토 서류 (BATCH K-41)</h2>
      <div class="sub">THEORETICAL DIVISION — CALCULATION LOG</div>
    </div>
    <button class="modal-close" id="modal-close">닫기 (ESC)</button>
  </div>
  <div class="modal-body" id="modal-content">
    <div class="punch-card-stack" id="card-stack">
      <!-- 펀치카드들이 자바스크립트로 동적 렌더링됩니다 -->
    </div>
  </div>
  <div class="modal-actions">
    <button class="btn-action btn-reject" id="btn-reject" disabled>
      <span>✕</span> REJECTED (반려 날인)
    </button>
    <button class="btn-action btn-approve" id="btn-approve" disabled>
      <span>✓</span> APPROVED (승인 날인)
    </button>
  </div>
</div>

<!-- 모바일 조이스틱 -->
<div id="joy-zone"><div id="joy-knob"></div></div>

<!-- 로딩 화면 -->
<div id="loading">
  <div class="spinner"></div>
  <div class="load-title">NAMELESS Ⅱ — 1943</div>
  <div class="load-detail" id="load-detail">이론물리부 계산실 3D 에셋을 구축하는 중…</div>
</div>

<!-- Three.js 및 GLTFLoader 로컬 로드 -->
<script src="../assets/vendor/three.min.js"></script>
<script src="../assets/vendor/GLTFLoader.js"></script>

<script>
/* ==========================================================================
   NAMELESS Ⅱ — Chapter 01 : Richard / Calculation Chain
   전용 공간: 1943년 로스앨러모스 이론물리부 계산실 (Lab F-1)
   실사 3D 모델: metal_office_desk, WoodenChair_01, desk_lamp_arm_01,
                 standing_chalkboard_01, wooden_bookshelf_worn,
                 vintage_radio_transceiver
   ========================================================================== */
(function() {
  'use strict';

  // --- 상태 관리 ---
  const Phase = {
    START: 'START',
    REVIEW: 'REVIEW',
    ERROR_FOUND: 'ERROR_FOUND',
    REJECTED: 'REJECTED',
    REVISING: 'REVISING',
    RESUBMITTED: 'RESUBMITTED',
    APPROVED: 'APPROVED',
    COMPLETE: 'COMPLETE'
  };

  let currentPhase = Phase.START;
  let hasFoundMismatch = false;

  // 펀치카드 원본 데이터 (오류 포함본: Card 05의 입력이 구버전 39.9)
  const ORIGINAL_CARDS = [
    { id: 'CARD 03', date: 'JUN 14', rev: 'B', batch: 'K-41', inVal: '18.4', outVal: '27.6', source: 'CR-17' },
    { id: 'CARD 04', date: 'JUN 14', rev: 'B', batch: 'K-41', inVal: '27.6', outVal: '41.4', source: 'CARD 03' },
    { id: 'CARD 05', date: 'JUN 12', rev: 'A', batch: 'K-41', inVal: '39.9', outVal: '59.8', source: 'CARD 04', error: true },
    { id: 'CARD 06', date: 'JUN 12', rev: 'A', batch: 'K-41', inVal: '59.8', outVal: '74.7', source: 'CARD 05', error: true }
  ];

  // 수정본 데이터 (파인만 재계산 후: Rev B 정규 체인 41.4 -> 62.1 -> 77.6)
  const REVISED_CARDS = [
    { id: 'CARD 03', date: 'JUN 14', rev: 'B', batch: 'K-41', inVal: '18.4', outVal: '27.6', source: 'CR-17' },
    { id: 'CARD 04', date: 'JUN 14', rev: 'B', batch: 'K-41', inVal: '27.6', outVal: '41.4', source: 'CARD 03' },
    { id: 'CARD 05', date: 'JUN 14', rev: 'B', batch: 'K-41', inVal: '41.4', outVal: '62.1', source: 'CARD 04' },
    { id: 'CARD 06', date: 'JUN 14', rev: 'B', batch: 'K-41', inVal: '62.1', outVal: '77.6', source: 'CARD 05' }
  ];

  // --- 3D 씬 환경 초기화 ---
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1112);
  scene.fog = new THREE.FogExp2(0x131718, 0.045);

  const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 80);
  camera.position.set(0, 1.65, 2.2); // 집무 책상 앞 서있는 시점

  // 조명 셋업 (1943년 오후 뉴멕시코 사막의 온백색 채광 & 램프)
  const ambient = new THREE.AmbientLight(0xdde3e8, 0.55);
  scene.add(ambient);

  // 서쪽 창문으로 들어오는 강렬한 사막 오후 직사광 (따뜻한 금빛)
  const sunLight = new THREE.DirectionalLight(0xffdfa8, 2.2);
  sunLight.position.set(-8, 6, -1);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 0.5;
  sunLight.shadow.camera.far = 25;
  sunLight.shadow.camera.left = -6;
  sunLight.shadow.camera.right = 6;
  sunLight.shadow.camera.top = 6;
  sunLight.shadow.camera.bottom = -6;
  sunLight.shadow.bias = -0.0004;
  scene.add(sunLight);

  // 실내 온백색 필 라이트
  const ceilingFill = new THREE.PointLight(0xffecd0, 0.8, 12);
  ceilingFill.position.set(0, 2.9, 0);
  scene.add(ceilingFill);

  // 책상 작업등 스팟 라이트 (책상 상판 강조)
  const deskSpot = new THREE.SpotLight(0xfff3da, 3.2, 5, Math.PI / 4, 0.4, 1.2);
  deskSpot.position.set(-0.65, 1.4, 0.5);
  deskSpot.target.position.set(0, 0.75, 0.5);
  deskSpot.castShadow = true;
  scene.add(deskSpot);
  scene.add(deskSpot.target);

  // --- 공간 건축 (Calculation Lab F-1 룸 메시) ---
  const roomGroup = new THREE.Group();
  scene.add(roomGroup);

  // 바닥 텍스처 (월넛 원목 플랭크)
  function createFloor() {
    const floorGeo = new THREE.PlaneGeometry(8.4, 9.6);
    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 1024;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#3a2b1d'; ctx.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 32; i++) {
      ctx.fillStyle = (i % 2 === 0) ? '#453322' : '#332417';
      ctx.fillRect(0, i * 32, 1024, 30);
      ctx.fillStyle = '#1c130b';
      ctx.fillRect(0, i * 32 + 30, 1024, 2);
    }
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(4, 4);

    const floorMat = new THREE.MeshStandardMaterial({
      map: texture, roughness: 0.38, metalness: 0.05
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    roomGroup.add(floor);
  }
  createFloor();

  // 벽체 (하부 목재 웨인스코팅 + 상부 웜크림 회반죽)
  function createWalls() {
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xdfd8c7, roughness: 0.9 });
    const wainscotMat = new THREE.MeshStandardMaterial({ color: 0x2e352f, roughness: 0.7 }); // 짙은 군용 올리브 그린

    // 북쪽 전면 벽
    const northWall = new THREE.Mesh(new THREE.BoxGeometry(8.4, 3.2, 0.1), wallMat);
    northWall.position.set(0, 1.6, -4.8);
    northWall.receiveShadow = true;
    roomGroup.add(northWall);

    const northWain = new THREE.Mesh(new THREE.BoxGeometry(8.4, 1.1, 0.12), wainscotMat);
    northWain.position.set(0, 0.55, -4.79);
    roomGroup.add(northWain);

    // 남쪽 후면 벽 (출입문 포함)
    const southWall = new THREE.Mesh(new THREE.BoxGeometry(8.4, 3.2, 0.1), wallMat);
    southWall.position.set(0, 1.6, 4.8);
    southWall.receiveShadow = true;
    roomGroup.add(southWall);

    const southWain = new THREE.Mesh(new THREE.BoxGeometry(8.4, 1.1, 0.12), wainscotMat);
    southWain.position.set(0, 0.55, 4.79);
    roomGroup.add(southWain);

    // 서쪽 벽 (창문 2개 타공형)
    const westWall = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3.2, 9.6), wallMat);
    westWall.position.set(-4.2, 1.6, 0);
    westWall.receiveShadow = true;
    roomGroup.add(westWall);

    // 동쪽 벽
    const eastWall = new THREE.Mesh(new THREE.BoxGeometry(0.1, 3.2, 9.6), wallMat);
    eastWall.position.set(4.2, 1.6, 0);
    eastWall.receiveShadow = true;
    roomGroup.add(eastWall);

    // 천장 보 (Wooden Beams)
    for (let z = -3.6; z <= 3.6; z += 2.4) {
      const beam = new THREE.Mesh(new THREE.BoxGeometry(8.4, 0.25, 0.35), new THREE.MeshStandardMaterial({ color: 0x2b2118, roughness: 0.85 }));
      beam.position.set(0, 3.08, z);
      beam.castShadow = true;
      roomGroup.add(beam);
    }
  }
  createWalls();

  // --- 실사 3D 오픈소스 에셋 로드 (GLTFLoader) ---
  const loader = new THREE.GLTFLoader();
  const interactables = [];
  const loadDetail = document.getElementById('load-detail');

  const MODEL_MANIFEST = [
    { id: 'desk', path: '../assets/models/metal_office_desk/metal_office_desk.gltf', pos: [0, 0, 0.5], rot: [0, Math.PI, 0], scale: 1.15 },
    { id: 'chair', path: '../assets/models/WoodenChair_01/WoodenChair_01.gltf', pos: [0, 0, -0.2], rot: [0, 0, 0], scale: 1.1 },
    { id: 'lamp', path: '../assets/models/desk_lamp_arm_01/desk_lamp_arm_01.gltf', pos: [-0.65, 0.86, 0.45], rot: [0, Math.PI * 0.4, 0], scale: 1.0 },
    { id: 'board', path: '../assets/models/standing_chalkboard_01/standing_chalkboard_01.gltf', pos: [-2.8, 0, -1.8], rot: [0, Math.PI * 0.28, 0], scale: 1.05 },
    { id: 'shelf', path: '../assets/models/wooden_bookshelf_worn/wooden_bookshelf_worn.gltf', pos: [-2.6, 0, 4.2], rot: [0, Math.PI, 0], scale: 1.0 },
    { id: 'radio', path: '../assets/models/vintage_radio_transceiver/vintage_radio_transceiver.gltf', pos: [3.2, 0.85, 2.0], rot: [0, -Math.PI * 0.45, 0], scale: 0.95 }
  ];

  let modelsLoadedCount = 0;

  MODEL_MANIFEST.forEach(item => {
    loader.load(
      item.path,
      function(gltf) {
        const root = gltf.scene;
        root.position.set(item.pos[0], item.pos[1], item.pos[2]);
        root.rotation.set(item.rot[0], item.rot[1], item.rot[2]);
        root.scale.set(item.scale, item.scale, item.scale);
        root.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              child.material.envMapIntensity = 0.8;
            }
          }
        });
        scene.add(root);
        modelsLoadedCount++;
        loadDetail.textContent = `오브젝트 배치 중 (${modelsLoadedCount}/${MODEL_MANIFEST.length})…`;

        if (modelsLoadedCount === MODEL_MANIFEST.length) {
          finishSetup();
        }
      },
      undefined,
      function(err) {
        console.warn('GLTF 로드 폴백 시뮬레이션:', item.id, err);
        modelsLoadedCount++;
        if (modelsLoadedCount === MODEL_MANIFEST.length) finishSetup();
      }
    );
  });

  // --- 책상 위 상호작용 프롭 (검토 서류철 & 스탬프 리그) ---
  let documentFolderMesh;
  let rejectStampMesh, approveStampMesh;

  function createDeskProps() {
    // 서류철 (계산 카드 바인더)
    const folderGeo = new THREE.BoxGeometry(0.38, 0.035, 0.28);
    const folderMat = new THREE.MeshStandardMaterial({ color: 0x8a6d45, roughness: 0.9 });
    documentFolderMesh = new THREE.Mesh(folderGeo, folderMat);
    documentFolderMesh.position.set(0.15, 0.88, 0.45);
    documentFolderMesh.rotation.y = -0.08;
    documentFolderMesh.castShadow = true;
    documentFolderMesh.name = 'DOCUMENT_FOLDER';
    scene.add(documentFolderMesh);
    interactables.push({ mesh: documentFolderMesh, label: '계산 카드 검토 [클릭]', action: openCardReview });

    // 스탬프 거치대
    const stampBase = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.02, 0.12), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5, metalness: 0.6 }));
    stampBase.position.set(-0.35, 0.875, 0.62);
    scene.add(stampBase);

    // REJECTED 도장 (붉은 손잡이)
    const rejHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.024, 0.08, 16), new THREE.MeshStandardMaterial({ color: 0x9e2a22, roughness: 0.6 }));
    rejHandle.position.set(-0.4, 0.925, 0.62);
    rejHandle.castShadow = true;
    rejHandle.name = 'STAMP_REJECT';
    scene.add(rejHandle);
    rejectStampMesh = rejHandle;

    // APPROVED 도장 (황동/원목 손잡이)
    const appHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.024, 0.08, 16), new THREE.MeshStandardMaterial({ color: 0x2a5d42, roughness: 0.6 }));
    appHandle.position.set(-0.3, 0.925, 0.62);
    appHandle.castShadow = true;
    appHandle.name = 'STAMP_APPROVE';
    scene.add(appHandle);
    approveStampMesh = appHandle;
  }
  createDeskProps();

  // --- 3D 리처드 파인만 캐릭터 모델 (책상 맞은편 대기) ---
  let richardGroup;
  function createRichardFeynman() {
    richardGroup = new THREE.Group();
    richardGroup.position.set(0.45, 0, -0.65);
    richardGroup.rotation.y = Math.PI * 0.92;

    const suitMat = new THREE.MeshStandardMaterial({ color: 0x3d4447, roughness: 0.85 });
    const shirtMat = new THREE.MeshStandardMaterial({ color: 0xeae4d2, roughness: 0.9 });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xc89674, roughness: 0.8 });
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x241d17, roughness: 0.95 });

    // 몸통 (셔츠 & 멜빵)
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.65, 0.25), shirtMat);
    torso.position.set(0, 1.18, 0);
    torso.castShadow = true;
    richardGroup.add(torso);

    // 멜빵 2줄
    [-0.12, 0.12].forEach(x => {
      const susp = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.66, 0.26), new THREE.MeshStandardMaterial({ color: 0x1a1918 }));
      susp.position.set(x, 1.18, 0);
      richardGroup.add(susp);
    });

    // 바지
    const pants = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.85, 0.24), suitMat);
    pants.position.set(0, 0.45, 0);
    pants.castShadow = true;
    richardGroup.add(pants);

    // 머리
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 16), skinMat);
    head.position.set(0, 1.62, 0);
    head.scale.set(0.9, 1.1, 0.9);
    head.castShadow = true;
    richardGroup.add(head);

    // 젊은 파인만의 자연스러운 웨이브 헤어
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.6), hairMat);
    hair.position.set(0, 1.66, -0.01);
    hair.scale.set(0.95, 1.05, 0.95);
    richardGroup.add(hair);

    scene.add(richardGroup);
    interactables.push({ mesh: torso, label: '리처드 파인만과 대화', action: talkToRichard });
  }
  createRichardFeynman();

  // --- 플레이어 시점 이동 & 상호작용 컨트롤러 ---
  let isPointerLocked = false;
  let yaw = 0, pitch = 0;
  const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false };

  canvas.addEventListener('click', function() {
    if (!isPointerLocked && document.getElementById('modal').classList.contains('open') === false) {
      canvas.requestPointerLock();
    }
  });

  document.addEventListener('pointerlockchange', function() {
    isPointerLocked = (document.pointerLockElement === canvas);
  });

  document.addEventListener('mousemove', function(e) {
    if (!isPointerLocked) return;
    yaw -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-Math.PI * 0.42, Math.min(Math.PI * 0.42, pitch));
    updateCameraRotation();
  });

  function updateCameraRotation() {
    const euler = new THREE.Euler(0, 0, 0, 'YXZ');
    euler.x = pitch; euler.y = yaw;
    camera.quaternion.setFromEuler(euler);
  }

  document.addEventListener('keydown', function(e) {
    if (keys[e.code] !== undefined) keys[e.code] = true;
    if (e.code === 'KeyE') checkInteraction();
    if (e.code === 'Escape') closeModal();
  });

  document.addEventListener('keyup', function(e) {
    if (keys[e.code] !== undefined) keys[e.code] = false;
  });

  // 조준점 레이캐스팅
  const raycaster = new THREE.Raycaster();
  const centerScreen = new THREE.Vector2(0, 0);
  const labelEl = document.getElementById('label');
  const reticleEl = document.getElementById('reticle');
  let currentTarget = null;

  function updateRaycast() {
    raycaster.setFromCamera(centerScreen, camera);
    const meshes = interactables.map(item => item.mesh);
    const hits = raycaster.intersectObjects(meshes, true);

    if (hits.length > 0 && hits[0].distance < 3.2) {
      const hitMesh = hits[0].object;
      const target = interactables.find(item => item.mesh === hitMesh || item.mesh.children.includes(hitMesh));
      if (target) {
        currentTarget = target;
        labelEl.textContent = target.label;
        labelEl.classList.add('show');
        reticleEl.classList.add('active');
        return;
      }
    }
    currentTarget = null;
    labelEl.classList.remove('show');
    reticleEl.classList.remove('active');
  }

  function checkInteraction() {
    if (currentTarget && currentTarget.action) {
      currentTarget.action();
    }
  }

  canvas.addEventListener('pointerdown', function() {
    if (currentTarget && currentTarget.action) {
      currentTarget.action();
    }
  });

  // 이동 업데이트
  function updatePlayerMovement(dt) {
    if (!isPointerLocked) return;
    const speed = 2.4 * dt;
    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    forward.y = 0; forward.normalize();
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    right.y = 0; right.normalize();

    if (keys.KeyW) camera.position.addScaledVector(forward, speed);
    if (keys.KeyS) camera.position.addScaledVector(forward, -speed);
    if (keys.KeyA) camera.position.addScaledVector(right, -speed);
    if (keys.KeyD) camera.position.addScaledVector(right, speed);

    // 방 경계 제한 (충돌 방지)
    camera.position.x = Math.max(-3.6, Math.min(3.6, camera.position.x));
    camera.position.z = Math.max(-4.0, Math.min(4.0, camera.position.z));
    camera.position.y = 1.65;
  }

  // --- 대화 자막 시스템 ---
  const diagBar = document.getElementById('dialogue-bar');
  const diagSpeaker = document.getElementById('diag-speaker');
  const diagText = document.getElementById('diag-text');

  function showDialogue(speaker, text) {
    diagSpeaker.textContent = speaker;
    diagText.textContent = text;
    diagBar.classList.remove('hidden');
  }

  diagBar.addEventListener('click', function() {
    diagBar.classList.add('hidden');
  });

  function talkToRichard() {
    if (currentPhase === Phase.START) {
      showDialogue('RICHARD', '“박사님. 계산부에서 첫 결과가 나왔습니다. 한 번 확인해 주시죠.”');
    } else if (currentPhase === Phase.ERROR_FOUND) {
      showDialogue('RICHARD', '“……잠깐. 이 값은 여기서 나온 게 아니군요. 전사 과정에서 섞였습니다.”');
    } else if (currentPhase === Phase.REJECTED) {
      showDialogue('RICHARD', '“알겠습니다. 카드 5와 6을 처음부터 다시 돌리겠습니다.”');
    } else if (currentPhase === Phase.RESUBMITTED) {
      showDialogue('RICHARD', '“수정본입니다. 이번에는 전부 정상적으로 연결됩니다.”');
    } else if (currentPhase === Phase.APPROVED) {
      showDialogue('RICHARD', '“좋군요! 앞으로 박사님 책상에 오기 전에는 한 번 더 의심해 보겠습니다.”');
    }
  }

  // --- 50vw 검토 서류 모달 및 퍼즐 검증 ---
  const modal = document.getElementById('modal');
  const cardStackEl = document.getElementById('card-stack');
  const btnReject = document.getElementById('btn-reject');
  const btnApprove = document.getElementById('btn-approve');
  const modalClose = document.getElementById('modal-close');

  function openCardReview() {
    if (document.exitPointerLock) document.exitPointerLock();
    renderCards();
    modal.classList.add('open');
  }

  function closeModal() {
    modal.classList.remove('open');
  }
  modalClose.addEventListener('click', closeModal);

  function renderCards() {
    const isRevised = (currentPhase === Phase.RESUBMITTED || currentPhase === Phase.APPROVED || currentPhase === Phase.COMPLETE);
    const cardData = isRevised ? REVISED_CARDS : ORIGINAL_CARDS;

    cardStackEl.innerHTML = '';
    cardData.forEach((card, index) => {
      const cardEl = document.createElement('div');
      cardEl.className = 'punch-card';
      if (!isRevised && card.error && hasFoundMismatch) cardEl.classList.add('selected');

      cardEl.innerHTML = `
        <div class="card-top">
          <div class="card-id">${card.id}</div>
          <div class="card-meta">
            <span class="card-batch">${card.batch}</span>
            <span class="card-rev ${card.rev === 'B' ? 'rev-b' : 'rev-a'}">REV ${card.rev}</span>
            <span>${card.date}</span>
            <span>SRC: ${card.source}</span>
          </div>
        </div>
        <div class="card-data-row">
          <div>INPUT: <span class="val">${card.inVal}</span></div>
          <div class="card-arrow">➔</div>
          <div>OUTPUT: <span class="val">${card.outVal}</span></div>
        </div>
        <div class="punch-holes">
          <div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div>
          <div class="punch-hole"></div><div class="punch-hole"></div><div class="punch-hole"></div>
        </div>
        ${currentPhase === Phase.REJECTED && index >= 2 ? '<div class="stamp-imprint">REJECTED</div>' : ''}
        ${currentPhase === Phase.APPROVED ? '<div class="stamp-imprint approved">APPROVED</div>' : ''}
      `;

      // 카드 클릭 시 이전 카드와의 연결 대조
      cardEl.addEventListener('click', function() {
        if (!isRevised) {
          if (card.id === 'CARD 05') {
            hasFoundMismatch = true;
            currentPhase = Phase.ERROR_FOUND;
            btnReject.disabled = false;
            talkToRichard();
            renderCards();
            document.getElementById('objective-text').textContent = '계산 체인의 오류가 입증되었습니다. [REJECTED (반려)] 도장을 날인하십시오.';
          } else {
            showDialogue('NOTE', `${card.id}: 출력 ${card.outVal}이 다음 카드의 입력으로 올바르게 이어져야 합니다.`);
          }
        }
      });

      cardStackEl.appendChild(cardEl);
    });

    if (isRevised && currentPhase === Phase.RESUBMITTED) {
      btnApprove.disabled = false;
      btnReject.disabled = true;
    }
  }

  // 반려 도장 날인
  btnReject.addEventListener('click', function() {
    currentPhase = Phase.REJECTED;
    btnReject.disabled = true;
    animateStamp(rejectStampMesh, function() {
      renderCards();
      talkToRichard();
      document.getElementById('objective-text').textContent = '파인만이 계산실 벤치에서 수정본을 재검산하고 있습니다. 잠시 대기하십시오.';

      // 3초 후 파인만이 수정본 재제출
      setTimeout(function() {
        currentPhase = Phase.RESUBMITTED;
        talkToRichard();
        renderCards();
        document.getElementById('objective-text').textContent = '파인만의 수정본(Rev B)이 도착했습니다. 최종 체인을 검증하고 [APPROVED (승인)] 도장을 날인하십시오.';
      }, 3500);
    });
  });

  // 승인 도장 날인
  btnApprove.addEventListener('click', function() {
    currentPhase = Phase.APPROVED;
    btnApprove.disabled = true;
    animateStamp(approveStampMesh, function() {
      renderCards();
      talkToRichard();
      document.getElementById('objective-text').textContent = '계산 체인 검증이 완료되었습니다. 복도 출입문이 열렸습니다. (CH02 해금)';

      // 진행도 로컬 저장
      localStorage.setItem('NAMELESS2_PROGRESS', JSON.stringify({
        chapter01Complete: true,
        unlockedChapter: 2
      }));
    });
  });

  // 스탬프 물리 타격 애니메이션
  function animateStamp(mesh, onDone) {
    if (!mesh) { onDone(); return; }
    const startY = mesh.position.y;
    let progress = 0;
    const anim = setInterval(function() {
      progress += 0.12;
      if (progress < 0.5) {
        mesh.position.y = startY + Math.sin(progress * Math.PI) * 0.15;
      } else if (progress < 1.0) {
        mesh.position.y = startY - 0.05; // 쾅 내려찍음
      } else {
        mesh.position.y = startY;
        clearInterval(anim);
        onDone();
      }
    }, 25);
  }

  // --- 준비 완료 및 루프 시작 ---
  function finishSetup() {
    const loadingEl = document.getElementById('loading');
    loadingEl.classList.add('hidden');
    showDialogue('RICHARD', '“박사님. 계산부에서 첫 결과가 나왔습니다. 한 번 확인해 주시죠.”');
  }

  let lastTime = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    updatePlayerMovement(dt);
    updateRaycast();

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  // 윈도우 리사이즈
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

})();
</script>
</body>
</html>
